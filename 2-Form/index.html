<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация</title>
</head>
<body>
  <!-- Форма регистрации, полная копия макета -->
  <form>
    <!-- Заголовок и ссылка на вход -->
    <h1>Регистрация</h1>
    <p>
      Уже есть аккаунт? <a href="#">Войти</a>
    </p>

    <!-- Поля ввода -->
    <fieldset>
      <legend>Мой компания</legend>
      <div>
        <label for="firstName">Имя</label>
        <input type="text" id="firstName" name="firstName">
      </div>
      <div>
        <label for="lastName">Фамилия</label>
        <input type="text" id="lastName" name="lastName">
      </div>
      <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email">
      </div>
    </fieldset>

    <!-- Кнопка регистрации со стрелкой -->
    <button type="submit">
      Зарегистрироваться →
    </button>

    <!-- Чекбокс и соглашение -->
    <div>
      <input type="checkbox" id="terms" name="terms">
      <label for="terms">Я прочитал и принимаю Условия использования</label>
    </div>
  </form>
</body>
</html>
